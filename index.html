*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button,.boton{min-height:56px;padding:12px 18px;border:1px solid var(--borde);border-radius:10px;background:#fff;color:#173c5d;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}button:hover,.boton:hover{background:#edf4fa}button:disabled{opacity:.45;cursor:not-allowed}button.primario,.boton.primario{background:var(--azul);color:white;border-color:var(--azul)}button.peligro{color:#a51c1c;border-color:#cb8888}button:focus-visible,a:focus-visible,input:focus,textarea:focus,select:focus{outline:3px solid #006db6;outline-offset:3px}input,textarea,select{width:100%;min-height:56px;padding:12px;border:1px solid #8a9dac;border-radius:8px;background:white;color:#182b3b}input[type=checkbox]{width:28px;min-height:28px;height:28px;accent-color:var(--azul)}textarea{resize:vertical;line-height:1.5}label{display:block;font-weight:700}label>input,label>textarea,label>select{margin-top:8px;font-weight:400}h1{font-size:1.65rem;margin:0 0 16px}h2{font-size:1.25rem;margin:0 0 14px}h3{font-size:1.1rem;margin:0 0 12px}p{line-height:1.5;margin:10px 0}small,.secundario{font-size:.89rem;color:#4d6271}header{background:var(--azul);color:#fff;padding:18px max(18px,calc((100vw - 1100px)/2));display:flex;align-items:center;gap:12px}header strong{font-size:1.15rem}header .marca{font-size:1.5rem;border:2px solid #ffffff80;border-radius:8px;padding:5px 12px}header small{color:#e0ecf6;display:block;margin-top:4px}main{max-width:1140px;margin:auto;padding:24px 20px 130px}nav{position:fixed;z-index:5;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:white;border-top:2px solid var(--borde);padding:6px max(6px,calc((100vw - 1100px)/2)) calc(6px + env(safe-area-inset-bottom))}nav button{border:0;border-radius:8px;padding:7px 3px;flex-direction:column;gap:3px;font-size:.9rem}nav button span{font-size:1.35rem;line-height:1.2}nav button[aria-current=page]{background:#e6eff7;color:#173c5d;box-shadow:inset 0 3px var(--azul)}.fila{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.entre{justify-content:space-between}.crece{flex:1;min-width:0}.pila{display:grid;gap:16px}.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}.tarjeta{border:1px solid var(--borde);border-radius:12px;padding:20px;margin-bottom:16px;background:#fff}.tinte{background:#f3f7fb}.obra{padding-top:24px}.ofi{width:100%;display:block;text-align:left;margin:10px 0 14px;padding:20px}.ofi strong{font-size:1.1rem}.ofi .fila{margin-top:12px}.barra{height:10px;border-radius:6px;background:#dce4eb;overflow:hidden;margin-top:14px}.barra>span{display:block;height:100%;background:var(--verde)}.estado{display:inline-flex;gap:7px;align-items:center;font-size:.89rem;font-weight:700;color:#263e4e}.punto{width:13px;height:13px;min-width:13px;border-radius:50%;background:var(--gris);border:1px solid #0003}.estado.proceso .punto{background:var(--amarillo)}.estado.pendiente .punto{background:var(--naranjo)}.estado.listo .punto{background:var(--verde)}.etiqueta{font-size:.8rem;padding:5px 8px;border-radius:5px;background:#eef2f5;color:#425565;display:inline-block}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.chips button{padding:10px 14px}.chips button.activo{background:var(--azul);color:#fff}.elemento{display:flex;gap:16px;align-items:center;justify-content:space-between}.abrir{border:0;padding:0;display:block;text-align:left;flex:1;color:#182b3b;min-width:0;background:transparent;font-weight:400}.abrir strong{font-size:22px;display:inline-block;margin-right:10px}.descripcion{display:block;font-size:.94rem;line-height:1.4;margin:8px 0;overflow-wrap:anywhere}.piezas{display:flex;gap:8px;flex-wrap:wrap}.pieza{min-width:90px;min-height:70px;display:flex;flex-direction:column;gap:4px}.pieza.completa{background:#e8f5eb;color:#165726;border:2px solid #2e9e44}.pieza b{font-size:1.12rem}.vacio{text-align:center;padding:36px 18px;background:#f3f7fb;border:1px dashed #a8bac9;border-radius:12px}.aviso{padding:14px 16px;border:1px solid #b7cddd;border-radius:8px;background:#edf5fc;line-height:1.5}.bien{background:#edf8ef;border-color:#7fb68a;color:#185b29}.mal{background:#fff0ee;border-color:#d39891;color:#8a231b}.incierta{background:#fff5c2!important;border-color:#b38c00!important}.campo{margin:16px 0}.contador{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}.contador>span{min-width:68px}.contador output{min-width:42px;text-align:center;font-size:1.25rem;font-weight:bold}.contador button{min-width:56px;padding:10px}.paso{display:flex;gap:12px;align-items:center;margin-bottom:16px}.paso b{display:grid;place-items:center;border-radius:50%;width:42px;height:42px;flex:none;color:white;background:var(--azul)}.paso h2{margin:0}.tabla{overflow:auto}table{border-collapse:collapse;width:100%;min-width:620px}th,td{padding:8px;text-align:left;border-bottom:1px solid var(--borde)}th{font-size:.9rem}td input{min-width:85px}td:nth-child(1){width:130px}td:nth-child(2){width:105px}td:nth-child(4){width:100px}.historia{padding:12px 0;border-bottom:1px solid #e1e7ec;line-height:1.5;overflow-wrap:anywhere}.resuelta{background:#f3f4f5;color:#596772}.incidencia{border-left:5px solid var(--naranjo)}summary{min-height:56px;padding:16px 0;cursor:pointer}.menu{position:relative;margin:16px 0}.menu summary{min-height:56px;cursor:pointer;font-weight:bold;padding:16px;background:#edf4fa;border-radius:8px}.menu .pila{padding:12px 0}.menu button{justify-content:flex-start}.fecha{max-width:260px}#mensaje{position:fixed;z-index:20;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(94%,650px);padding:12px 16px;background:#173348;color:#fff;border-radius:12px;box-shadow:0 5px 24px #0003;display:flex;align-items:center;gap:12px}#mensaje[hidden],#actualizacion[hidden],#problema[hidden]{display:none}#mensaje span{flex:1}#mensaje button{color:#173348;flex-shrink:0}#actualizacion{width:100%;border-radius:0;background:#fff1b3;color:#513a00;border-color:#c9a547}#problema{border-radius:0;margin:0}dialog{border:0;border-radius:14px;padding:24px;width:min(94vw,620px);max-height:90dvh;color:#182b3b;box-shadow:0 20px 80px #0006}dialog::backdrop{background:#132c4077}dialog .acciones{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:24px}dialog .acciones button{flex:1}.separador{margin-top:26px;padding-top:24px;border-top:1px solid var(--borde)}.botones{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}.resumen{min-height:360px;font-family:inherit}.check{display:flex;align-items:center;gap:10px;min-height:56px}.romper{overflow-wrap:anywhere}
@media(max-width:640px){main{padding:20px 12px 125px}header{padding:14px 16px}.tarjeta{padding:16px}.elemento{align-items:stretch;flex-direction:column}.piezas{display:grid;grid-template-columns:repeat(3,1fr)}.pieza{min-width:0}.entre>h1{margin-bottom:0}h1{font-size:1.4rem}.contador{gap:8px}nav button{font-size:.8rem}.fila .primario{max-width:100%}dialog{padding:18px}}

<script>
'use strict';
const VERSION_APP='1.0.0',CLAVE='mecanizado_tecma_v1',TIPOS=['M','H','PF'];
const NOMBRES={M:['marco','marcos'],H:['hoja','hojas'],PF:['paño fijo','paños fijos']};
const ESTADOS={no:'No iniciado',proceso:'En proceso',pendiente:'Listo con pendiente',listo:'Listo'};
const TEXTO_CONVERSION=`Transcribe la carátula de la foto adjunta (Orden de Fabricación de Tecma). Responde SOLO con un bloque de código, sin ningún texto antes ni después, con este formato exacto:
OBRA;<nombre de la obra>
REFERENCIA;<texto de la fila REFERENCIA, vacío si no hay>
OFI;<solo el número de OFI>
OP;<número de OP>
FECHA;<fecha en formato dd-mm-aaaa>
COLOR;<texto de COLOR ALUMINIO>
TOTAL;<número del recuadro amarillo junto a VENTANAS TECHNAL o ELEMENTOS>
Luego una línea por cada fila de la tabla que tenga referencia, en el mismo orden:
<REFERENCIA>;<CANT>;<DESCRIPCION>
Reglas: copia los textos tal como aparecen, en mayúsculas; no uses punto y coma dentro de las descripciones (reemplázalo por coma); no inventes filas ni datos; si algo es ilegible escribe ?? en su lugar; incluye todas las filas.`;
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const copia=x=>JSON.parse(JSON.stringify(x)),uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const limpia=s=>String(s??'').trim().replace(/\s+/g,' '),obraNormal=s=>limpia(s).toUpperCase(),refNormal=s=>limpia(s).toUpperCase();
const ofiNormal=s=>String(s??'').toUpperCase().replace(/OFI/g,'').replace(/\s/g,'').replace(/^0+(?=\d)/,'');
const entero=(n,min=0)=>Number.isSafeInteger(n)&&n>=min;
function hoy(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function fechaISO(s){s=String(s??'').trim();if(/^\d{2}-\d{2}-\d{4}$/.test(s))s=s.split('-').reverse().join('-');if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return '';const d=new Date(s+'T12:00:00');return !isNaN(d)&&hoy(d)===s?s:''}
function fecha(s){const x=fechaISO(String(s).slice(0,10));return x?x.split('-').reverse().join('-'):String(s||'Sin fecha')}
function hora(s){return new Date(s).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit',hour12:false})}
function diaHistoria(s){return hoy(new Date(s))}
function edad(s){const a=hoy().split('-').map(Number),b=s.slice(0,10).split('-').map(Number);const n=Math.round((Date.UTC(a[0],a[1]-1,a[2])-Date.UTC(b[0],b[1]-1,b[2]))/86400000);return n===0?'hoy':n===1?'hace 1 día':n>1?`hace ${n} días`:'fecha futura'}
function piezas(n,t){return `${n} ${NOMBRES[t][n===1?0:1]}`}
function detenidas(e,t){return e.incidencias.filter(i=>i.tipo==='detenida'&&i.pieza===t&&!i.fechaResolucion).reduce((s,i)=>s+i.cantidad,0)}
function estado(e){const abiertas=e.incidencias.some(i=>!i.fechaResolucion);if(TIPOS.every(t=>e.listos[t]===e.total[t])&&!abiertas&&TIPOS.some(t=>e.total[t]>0))return 'listo';if(TIPOS.every(t=>e.listos[t]===0)&&!abiertas)return 'no';if(abiertas&&TIPOS.every(t=>e.listos[t]+detenidas(e,t)===e.total[t]))return 'pendiente';return 'proceso'}
const marca=s=>`<span class="estado ${s}"><span class="punto" aria-hidden="true"></span>${ESTADOS[s]}</span>`;
const vacio=()=>({version:1,ofis:[],elementos:[],historial:[]});
let db=vacio(),guardado=null,bloqueado=false,temporizador,undo=null,registroSW=null;
const ui={pagina:'obras',ofiId:null,elementoId:null,filtro:'todos',busca:'',archivadas:false,dia:hoy(),borrador:null,texto:'',resumenId:''};

function verificar(d){
 if(!d||d.version!==1||!Array.isArray(d.ofis)||!Array.isArray(d.elementos)||!Array.isArray(d.historial))throw Error('El respaldo no tiene el formato de Mecanizado Tecma.');
 const ids=new Set(),claves=new Set(),refs=new Set(),incIds=new Set();
 const str=v=>typeof v==='string',momento=v=>str(v)&&!isNaN(Date.parse(v));
 for(const o of d.ofis){
  const clave=obraNormal(o.obra)+'\n'+ofiNormal(o.ofi);
  if(!str(o.id)||!o.id||ids.has(o.id)||claves.has(clave)||!['obra','referencia','ofi','op','fecha','color'].every(k=>str(o[k]))||!obraNormal(o.obra)||!ofiNormal(o.ofi)||!entero(o.totalCaratula)||!momento(o.creada)||typeof o.archivada!=='boolean')throw Error('Hay datos de OFI inválidos o repetidos.');
  ids.add(o.id);claves.add(clave);o.obra=obraNormal(o.obra);o.ofi=ofiNormal(o.ofi);
 }
 const elementIds=new Set();
 for(const e of d.elementos){
  const clave=e.ofiId+'\n'+refNormal(e.ref);
  if(!str(e.id)||!e.id||elementIds.has(e.id)||!ids.has(e.ofiId)||!str(e.ref)||!refNormal(e.ref)||refs.has(clave)||!str(e.desc)||!str(e.nota)||!entero(e.cant,1)||!e.total||!e.listos||!Array.isArray(e.incidencias))throw Error('Hay elementos inválidos o referencias repetidas.');
  elementIds.add(e.id);refs.add(clave);
  for(const i of e.incidencias){
   if(!str(i.id)||!i.id||incIds.has(i.id)||!['detenida','externa'].includes(i.tipo)||!fechaISO(i.fechaInicio)||!(i.fechaResolucion===null||momento(i.fechaResolucion))||(i.motivo!==undefined&&!str(i.motivo))||(i.comentario!==undefined&&!str(i.comentario))||(i.tipo==='detenida'&&(!TIPOS.includes(i.pieza)||!entero(i.cantidad,1))))throw Error('Hay una incidencia inválida.');
   incIds.add(i.id);
  }
  for(const t of TIPOS)if(!entero(e.total[t])||!entero(e.listos[t])||!entero(detenidas(e,t))||e.listos[t]+detenidas(e,t)>e.total[t])throw Error('Un conteo supera el total de piezas.');
 }
 for(const h of d.historial)if(!momento(h.fechaHora)||!str(h.ofiId)||!str(h.ref)||!str(h.texto))throw Error('Hay un registro de historial inválido.');
 return d;
}

function errorGuardado(m){$('#problema').hidden=false;$('#problema').textContent=m}
function cargar(){
 try{guardado=localStorage.getItem(CLAVE);db=guardado?verificar(JSON.parse(guardado)):vacio()}
 catch(e){bloqueado=true;errorGuardado('No se pudo leer el registro. No se sobrescribirá. En Más puedes descargarlo e importar un respaldo. '+e.message)}
}
function aviso(texto,deshacer=null){
 clearTimeout(temporizador);undo=deshacer;$('#mensaje span').textContent=texto;$('#deshacer').hidden=!deshacer;$('#mensaje').hidden=false;
 temporizador=setTimeout(()=>{$('#mensaje').hidden=true;undo=null},6000);
}
function historial(ofiId,ref,texto,elementoId=''){
 const o=db.ofis.find(o=>o.id===ofiId);
 db.historial.push({fechaHora:new Date().toISOString(),ofiId,ref,texto,elementoId,obra:o?.obra||'',ofi:o?.ofi||'',op:o?.op||''});
}
function cambiar(fn,texto='',reversible=false,permitirBloqueado=false,pintar=true){
 if(bloqueado&&!permitirBloqueado){alert('El registro está protegido porque no se pudo leer. Exporta o importa un respaldo en Más.');return false}
 const antes=copia(db);
 try{
  if(localStorage.getItem(CLAVE)!==guardado){
   alert('El registro cambió en otra pestaña. Se cargarán esos cambios; vuelve a realizar esta acción.');
   cerrarDialogo(true);cargar();render();return false;
  }
  fn();verificar(db);
  const nuevo=JSON.stringify(db);
  localStorage.setItem(CLAVE,nuevo);guardado=nuevo;bloqueado=false;$('#problema').hidden=true;
  undo=null;$('#mensaje').hidden=true;if(pintar)render();
  const registroUndo=copia(db.historial.at(-1)||{});
  if(texto)aviso(texto,reversible?()=>cambiar(()=>{
   const registros=db.historial;db=antes;db.historial=registros;
   historial(registroUndo.ofiId||'',registroUndo.ref||'','Se deshizo: '+registroUndo.texto,registroUndo.elementoId||'');
  },'Marca deshecha.'):null);
  return true;
 }catch(e){
  db=antes;cerrarDialogo(true);render();
  errorGuardado('No se guardó el cambio: '+e.message+' El registro anterior se conserva.');
  return false;
 }
}
function sugerir(desc,cant){
 const s=desc.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
 const fijo=/^FYA\s+(?:(\d+)\s+)?FIJOS?\b/.exec(s);
 const combinado=/\(\s*(\d+)\s+MOVIL(?:ES)?\s*\+\s*(\d+)\s+FIJOS?\s*\)/.exec(s);
 if(fijo&&!s.includes('+'))return {M:0,H:0,PF:Number(fijo[1]||1)*cant};
 if(combinado)return {M:cant,H:(Number(combinado[1])+Number(combinado[2]))*cant,PF:0};
 return {M:cant,H:cant,PF:0};
}
function nuevoElemento(r,ofiId){
 return {id:uid(),ofiId,ref:refNormal(r.ref),cant:Number(r.cant),desc:limpia(r.desc),total:sugerir(r.desc,Number(r.cant)),listos:{M:0,H:0,PF:0},incidencias:[],nota:'',totalesRevisados:false};
}
const elementos=id=>db.elementos.filter(e=>e.ofiId===id),actual=()=>db.elementos.find(e=>e.id===ui.elementoId);
function estadisticas(id){
 const lista=elementos(id),cuenta={no:0,proceso:0,pendiente:0,listo:0};
 lista.forEach(e=>cuenta[estado(e)]++);
 return {lista,cuenta,total:lista.reduce((n,e)=>n+e.cant,0),listos:lista.filter(e=>estado(e)==='listo').reduce((n,e)=>n+e.cant,0)};
}
function navegar(pagina,id){
 ui.pagina=pagina;
 if(pagina==='ofi'){ui.ofiId=id;ui.filtro='todos'}
 if(pagina==='elemento'){ui.elementoId=id;ui.ofiId=actual()?.ofiId}
 render();window.scrollTo(0,0);
}
function render(){
 if(ui.pagina==='ofi'&&!db.ofis.some(o=>o.id===ui.ofiId))ui.pagina='obras';
 if(ui.pagina==='elemento'&&!actual())ui.pagina='obras';
 const vistas={obras:vistaObras,ofi:vistaOFI,elemento:vistaElemento,nueva:vistaNueva,hoy:vistaHoy,mas:vistaMas};
 $('#app').innerHTML=vistas[ui.pagina]();
 document.querySelectorAll('nav button').forEach(b=>{
  if(b.dataset.nav===(['ofi','elemento'].includes(ui.pagina)?'obras':ui.pagina))b.setAttribute('aria-current','page');
  else b.removeAttribute('aria-current');
 });
}
function tarjetaOFI(o){
 const s=estadisticas(o.id);
 return `<button class="ofi" data-accion="abrir-ofi" data-id="${esc(o.id)}"><strong>OFI ${esc(o.ofi)} · OP ${esc(o.op||'Sin OP')}</strong><p>${esc(o.referencia||'Sin referencia')}${o.archivada?' · Archivada':''}</p><div class="fila entre"><span>${s.listos} de ${s.total} elementos listos</span><span class="secundario">Ver elementos →</span></div><div class="barra" role="progressbar" aria-label="Elementos listos" aria-valuenow="${s.listos}" aria-valuemin="0" aria-valuemax="${s.total||1}"><span style="width:${s.total?s.listos/s.total*100:0}%"></span></div><div class="fila">${Object.keys(ESTADOS).map(k=>`<span>${marca(k)} <b>${s.cuenta[k]}</b></span>`).join('')}</div></button>`;
}
function listadoObras(){
 const q=obraNormal(ui.busca);
 const lista=db.ofis.filter(o=>(ui.archivadas||!o.archivada)&&(!q||[o.obra,o.op,o.ofi,o.referencia,...elementos(o.id).map(e=>e.ref)].some(s=>obraNormal(s).includes(q))));
 const obras=[...new Set(lista.map(o=>o.obra))];

function leerTexto(texto){
 const cab={obra:'',referencia:'',ofi:'',op:'',fecha:'',color:'',totalCaratula:''},filas=[],omitidas=[];
 const nombres={OBRA:'obra',REFERENCIA:'referencia',OFI:'ofi',OP:'op',FECHA:'fecha',COLOR:'color',TOTAL:'totalCaratula'};
 for(const [n,linea] of texto.split(/\r?\n/).entries()){
  const l=linea.trim();if(!l||l.startsWith('```'))continue;
  const partes=l.split(';'),primero=limpia(partes[0]).toUpperCase();
  if(Object.hasOwn(nombres,primero)&&partes.length===2){cab[nombres[primero]]=limpia(partes[1]);continue}
  if(partes.length>=2){
   if(primero==='REF'&&partes[1].toUpperCase()==='CANT')continue;
   const valido=/^\d+$/.test(partes[1].trim())&&entero(Number(partes[1]),1);
   filas.push({ref:limpia(partes[0]),cant:valido?Number(partes[1]):1,desc:limpia(partes.slice(2).join(',')),revisar:!valido});
  }else omitidas.push(n+1);
 }
 return {cab,filas,omitidas};
}

 return {suma,total,valido,coincide:valido&&suma===total};
}

let alEnviar=null,alCancelar=null,eventoInstalar=null;

function modal(titulo,contenido,enviar,boton='Guardar',cancelar=null){

function confirmar(titulo,texto,palabra=''){

async function copiarTexto(texto){

 catch{
  const t=document.createElement('textarea');t.value=texto;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();
  let bien=false;try{bien=document.execCommand('copy')}catch{}
  t.remove();
  if(bien){aviso('Copiado ✓');return true}
  modal('Copiar texto','<p>Mantén presionado el texto y elige Seleccionar todo → Copiar.</p><textarea rows="12" readonly id="copiaManual">'+esc(texto)+'</textarea>',()=>{},'Cerrar');
  return false;
 }
}
async function marcar(id,t,soloSumar=false){
 const e=db.elementos.find(e=>e.id===id);if(!e)return;
 const max=e.total[t]-detenidas(e,t);
 if(max===0){aviso('Todas las piezas de este tipo están detenidas. Resuelve su incidencia para marcarlas listas.');return}
 let valor=max;
 if(e.listos[t]===max){
  if(soloSumar)return;
  if(!await confirmar('Desmarcar piezas',`¿Desmarcar ${t==='H'?'las':'los'} ${NOMBRES[t][1]} de ${e.ref}?`))return;
  valor=0;
 }
 cambiar(()=>{
  e.listos[t]=valor;
  historial(e.ofiId,e.ref,`${e.ref}: ${valor} de ${e.total[t]} ${NOMBRES[t][1]} list${t==='H'?'as':'os'}`,e.id);
 },`${e.ref}: ${valor}/${e.total[t]} ${NOMBRES[t][1]} list${t==='H'?'as':'os'}.`,true);
}
function contador(tipo,t,delta){

 if(!entero(valor)||valor<min||valor>max)return;
 cambiar(()=>{
  e[tipo][t]=valor;if(tipo==='total')e.totalesRevisados=true;
  historial(e.ofiId,e.ref,`${e.ref}: ${tipo==='total'?'total corregido a '+piezas(valor,t):valor+' de '+e.total[t]+' '+NOMBRES[t][1]+' list'+(t==='H'?'as':'os')}`,e.id);
 },'Cambio guardado.',tipo==='listos');
}

  const inicio=fechaISO(f.get('fechaInicio'));
  if(!inicio||inicio>hoy()){alert('Escribe una fecha válida que no sea futura, con formato dd-mm-aaaa.');return false}
  const i={id:uid(),tipo,motivo:limpia(f.get('motivo')),comentario:limpia(f.get('comentario')),fechaInicio:inicio,fechaResolucion:null};
  if(tipo==='detenida'){
   i.pieza=f.get('pieza');i.cantidad=Number(f.get('cantidad'));
   if(!entero(i.cantidad,1)||i.cantidad>e.total[i.pieza]-detenidas(e,i.pieza)){alert('La cantidad supera las piezas disponibles. Revisa los totales y las incidencias abiertas.');return false}
  }else if(!i.comentario){alert('Escribe qué falta.');return false}
  return cambiar(()=>{
   if(tipo==='detenida')e.listos[i.pieza]=Math.min(e.listos[i.pieza],e.total[i.pieza]-detenidas(e,i.pieza)-i.cantidad);
   e.incidencias.push(i);historial(e.ofiId,e.ref,e.ref+': '+textoIncidencia(i),e.id);
  },'Incidencia registrada.');
 });
 if(tipo==='detenida')avisoReclasificacion();
}
function avisoReclasificacion(){
 const e=actual(),t=$('#tipoIncidencia').value,n=Number($('#cantidadIncidencia').value),disponibles=e.total[t]-detenidas(e,t),descontar=Math.max(0,e.listos[t]+n-disponibles);
 $('#avisoReclasificacion').textContent=`Disponibles para detener: ${disponibles}.`+(descontar>0&&n<=disponibles?` Se descontarán ${descontar} de las piezas listas al registrar esta incidencia.`:'');
 $('#cantidadIncidencia').max=disponibles;
}
async function resolverIncidencia(id,inc){
 const e=db.elementos.find(e=>e.id===id),i=e?.incidencias.find(i=>i.id===inc);
 if(!i||i.fechaResolucion)return;
 if(!await confirmar('Resolver incidencia',i.tipo==='detenida'?`${e.ref}: ${piezas(i.cantidad,i.pieza)} pasarán automáticamente a listas. ¿Confirmar?`:`¿Resolver la falta externa de ${e.ref}?`))return;
 cambiar(()=>{
  i.fechaResolucion=new Date().toISOString();if(i.tipo==='detenida')e.listos[i.pieza]+=i.cantidad;
  historial(e.ofiId,e.ref,e.ref+': incidencia resuelta – '+textoIncidencia(i),e.id);
 },'Incidencia resuelta.');
}
function cabeceraValidada(c){
 const o={obra:obraNormal(c.obra),ofi:ofiNormal(c.ofi),referencia:limpia(c.referencia),op:limpia(c.op),fecha:limpia(c.fecha),color:limpia(c.color),totalCaratula:Number(c.totalCaratula)};
 if(!o.obra||!o.ofi)throw Error('Completa Obra y OFI.');
 if(String(c.totalCaratula).trim()===''||!entero(o.totalCaratula))throw Error('El total de la carátula debe ser un número entero igual o mayor que cero.');
 if(o.fecha&&!o.fecha.includes('??')){
  const f=fechaISO(o.fecha);if(!f)throw Error('Revisa la fecha. Usa dd-mm-aaaa o déjala vacía.');
  o.fecha=fecha(f);
 }
 return o;
}
function editarOFI(){
 const o=db.ofis.find(o=>o.id===ui.ofiId);
 modal('Editar datos de la OFI',camposCabecera(o),f=>{
  const cambios=cabeceraValidada(Object.fromEntries(f));
  if(db.ofis.some(x=>x.id!==o.id&&x.obra===cambios.obra&&x.ofi===cambios.ofi)){alert('Ya existe esa OFI en esta obra.');return false}
  return cambiar(()=>{Object.assign(o,cambios);historial(o.id,'','Datos de la OFI actualizados.')},'Datos guardados.');
 });
}
function agregarElemento(){
 const id=ui.ofiId;
 modal('Agregar elemento a mano','<label>Referencia<input name="ref" required></label><label class="campo">Cantidad<input name="cant" type="number" min="1" step="1" value="1" required></label><label>Descripción<textarea name="desc" rows="3"></textarea></label>',f=>{
  const r=Object.fromEntries(f);
  if(!refNormal(r.ref)||!entero(Number(r.cant),1)){alert('Revisa la referencia y la cantidad.');return false}
  if(elementos(id).some(e=>refNormal(e.ref)===refNormal(r.ref))){alert('Esa referencia ya existe en la OFI.');return false}
  const e=nuevoElemento(r,id);
  return cambiar(()=>{db.elementos.push(e);historial(id,e.ref,e.ref+': elemento agregado.',e.id)},'Elemento agregado.');
 });
}
async function guardarOFI(){
 const b=ui.borrador;if(!b)return;
 let cab;try{cab=cabeceraValidada(b.cab)}catch(e){alert(e.message);return}
 if(!b.filas.length){alert('Agrega al menos un elemento.');return}
 const refs=new Set();
 for(const r of b.filas){
  const ref=refNormal(r.ref);
  if(!ref||!entero(Number(r.cant),1)){alert('Todas las filas deben tener referencia y una cantidad entera mayor que cero.');return}
  if(refs.has(ref)){alert('La referencia '+ref+' está repetida. Corrige o une esas filas.');return}
  refs.add(ref);
 }
 if(!validacion().coincide&&!await confirmar('Revisar cantidades',`La suma da ${validacion().suma} pero la carátula dice ${cab.totalCaratula}. ¿Guardar igual?`))return;
 if((b.omitidas.length||b.filas.some(r=>r.revisar)||JSON.stringify(b).includes('??'))&&!await confirmar('Hay datos por revisar','Hay campos dudosos, cantidades sugeridas o líneas no reconocidas. ¿Guardar de todas formas?'))return;
 const existe=db.ofis.find(o=>o.obra===cab.obra&&o.ofi===cab.ofi);
 if(existe&&!await confirmar('OFI existente','Esta OFI ya existe. ¿Agregar solo los elementos nuevos?'))return;
 const id=existe?.id||uid(),nuevas=b.filas.filter(r=>!existe||!elementos(id).some(e=>refNormal(e.ref)===refNormal(r.ref)));
 if(existe&&!nuevas.length){aviso('No hay referencias nuevas. El avance se conserva.');return}
 const ok=cambiar(()=>{
  if(!existe){db.ofis.push({...cab,id,creada:new Date().toISOString(),archivada:false});historial(id,'','OFI creada.')}
  for(const r of nuevas){const e=nuevoElemento(r,id);db.elementos.push(e);historial(id,e.ref,e.ref+': elemento agregado desde carátula.',e.id)}
 },`${nuevas.length} referencias guardadas.`);
 if(ok){ui.borrador=null;ui.texto='';navegar('ofi',id)}
}
async function eliminarOFI(){
 const o=db.ofis.find(o=>o.id===ui.ofiId);
 if(!await confirmar('Eliminar OFI',`¿Eliminar ${o.obra}, OFI ${o.ofi}, con todos sus elementos?`))return;
 if(!await confirmar('Confirmación final','Esta eliminación no se puede deshacer.','ELIMINAR'))return;
 cambiar(()=>{
  historial(o.id,'','OFI eliminada.');
  db.elementos=db.elementos.filter(e=>e.ofiId!==o.id);db.ofis=db.ofis.filter(x=>x.id!==o.id);
 },'OFI eliminada.');
}
async function eliminarElemento(){
 const e=actual();
 if(!await confirmar('Eliminar elemento',`¿Eliminar ${e.ref} y sus incidencias? Esta acción no se puede deshacer.`))return;
 const id=e.ofiId;
 if(cambiar(()=>{historial(id,e.ref,e.ref+': elemento eliminado.',e.id);db.elementos=db.elementos.filter(x=>x.id!==e.id)},'Elemento eliminado.'))navegar('ofi',id);
}
function descargar(blob,nombre){
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=nombre;document.body.append(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),30000);
}
async function exportar(){
 let contenido;
 try{contenido=bloqueado?(localStorage.getItem(CLAVE)||guardado||JSON.stringify(db)):JSON.stringify(db,null,2)}
 catch{contenido=guardado||JSON.stringify(db)}
 const nombre='mecanizado-respaldo-'+hoy()+'.json',archivo=new File([contenido],nombre,{type:'application/json'});
 descargar(archivo,nombre);
 if(navigator.canShare?.({files:[archivo]})){
  modal('Respaldo descargado','<p>¿Quieres compartir también el archivo? Puedes enviártelo por WhatsApp o guardarlo en otro lugar.</p>',()=>{
   navigator.share({files:[archivo],title:'Respaldo Mecanizado Tecma'}).catch(e=>{if(e.name!=='AbortError')aviso('El respaldo ya se descargó. Puedes compartirlo desde Descargas.')});
  },'Compartir');
 }else aviso('Respaldo descargado. Está en Descargas.');
}
async function importar(archivo){
 if(!archivo)return;
 let nuevo;
 try{nuevo=verificar(JSON.parse(await archivo.text()))}
 catch(e){alert('No se importó el archivo. '+e.message);return}
 if(!await confirmar('Importar respaldo',`Este respaldo tiene ${nuevo.ofis.length} OFI y ${nuevo.elementos.length} referencias. Reemplazará todo el registro actual. ¿Continuar?`))return;
 const ok=cambiar(()=>{db=nuevo},'Respaldo importado.',false,true);
 if(ok){ui.borrador=null;ui.texto='';navegar('obras')}
}
async function borrarTodo(){
 if(!await confirmar('Borrar todos los datos','¿Borrar todas las OFI, elementos, incidencias e historial de este dispositivo? Exporta un respaldo si deseas conservarlos.'))return;
 if(!await confirmar('Confirmación final','Esta acción no se puede deshacer.','BORRAR'))return;
 if(cambiar(()=>{db=vacio()},'Todos los datos se borraron.',false,true)){ui.borrador=null;ui.texto='';navegar('obras')}
}
async function accion(nombre,b){
 switch(nombre){
 case 'abrir-ofi':
  navegar('ofi',b.dataset.id);break;
 case 'abrir-elemento':
  navegar('elemento',b.dataset.id);break;
 case 'volver-ofi':
  navegar('ofi',ui.ofiId);break;
 case 'marca':
  await marcar(b.dataset.id,b.dataset.tipo);break;
 case 'todas':
  await marcar(b.dataset.id,b.dataset.tipo,true);break;
 case 'confirmar-totales':{
  const e=actual();
  cambiar(()=>{e.totalesRevisados=true;historial(e.ofiId,e.ref,e.ref+': totales confirmados.',e.id)},'Totales confirmados.');
  break;
 }
 case 'detenida':
  formularioIncidencia('detenida');break;
 case 'externa':
  formularioIncidencia('externa');break;
 case 'resolver':
  await resolverIncidencia(b.dataset.id,b.dataset.incidencia);break;
 case 'editar-ofi':
  editarOFI();break;
 case 'agregar-elemento':
  agregarElemento();break;
 case 'archivar':{
  const o=db.ofis.find(o=>o.id===ui.ofiId);
  if(await confirmar(o.archivada?'Desarchivar OFI':'Archivar OFI',o.archivada?'¿Volver a mostrar esta OFI entre las activas?':'¿Archivar esta OFI? Su avance se conservará.')){
   cambiar(()=>{o.archivada=!o.archivada;historial(o.id,'',o.archivada?'OFI archivada.':'OFI desarchivada.')},'Cambio guardado.');
  }
  break;
 }
 case 'eliminar-ofi':
  await eliminarOFI();break;
 case 'eliminar-elemento':
  await eliminarElemento();break;
 case 'resumen':
  ui.resumenId=b.dataset.id;navegar('mas');break;
 case 'copiar-instruccion':
  await copiarTexto(TEXTO_CONVERSION);break;
 case 'pegar':
  try{ui.texto=await navigator.clipboard.readText();$('#textoClaude').value=ui.texto;aviso('Texto pegado. Toca Revisar.')}
  catch{aviso('Mantén presionado el recuadro y elige Pegar.');$('#textoClaude').focus()}
  break;
 case 'revisar':
  if(!ui.texto.trim()){aviso('Primero pega la respuesta de Claude.');break}
  if(ui.borrador&&!await confirmar('Revisar nuevo texto','¿Reemplazar la vista previa y sus correcciones con el texto pegado?'))break;
  ui.borrador=leerTexto(ui.texto);render();$('#validacion').scrollIntoView({block:'center'});
  break;
 case 'manual':
  if(ui.borrador&&!await confirmar('Crear OFI a mano','¿Descartar la vista previa actual?'))break;
  ui.borrador={cab:{obra:'',referencia:'',ofi:'',op:'',fecha:fecha(hoy()),color:'',totalCaratula:''},filas:[{ref:'',cant:1,desc:'',revisar:false}],omitidas:[]};
  render();$('[data-cabecera="obra"]').focus();break;
 case 'agregar-fila':
  ui.borrador.filas.push({ref:'',cant:1,desc:'',revisar:false});
  render();document.querySelectorAll('[data-campo="ref"]').item(ui.borrador.filas.length-1).focus();
  break;
 case 'borrar-fila':
  if(await confirmar('Borrar fila','¿Borrar esta fila de la vista previa?')){ui.borrador.filas.splice(Number(b.dataset.fila),1);render()}
  break;
 case 'guardar-ofi':
  await guardarOFI();break;
 case 'copiar-resumen':
  await copiarTexto(resumen(ui.resumenId));break;
 case 'compartir-resumen':
  if(navigator.share){
   try{await navigator.share({title:'Resumen Mecanizado Tecma',text:resumen(ui.resumenId)})}
   catch(e){if(e.name!=='AbortError')await copiarTexto(resumen(ui.resumenId))}
  }else await copiarTexto(resumen(ui.resumenId));
  break;
 case 'exportar':
  await exportar();break;
 case 'importar':
  $('#archivoRespaldo').click();break;
 case 'borrar-todo':
  await borrarTodo();break;
 case 'instalar':
  if(eventoInstalar){await eventoInstalar.prompt();eventoInstalar=null;render()}
  break;
 }
}

document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.nav)navegar(b.dataset.nav);
 else if(b.dataset.filtro){ui.filtro=b.dataset.filtro;render()}
 else if(b.dataset.contador)contador(b.dataset.contador,b.dataset.tipo,Number(b.dataset.delta));
 else if(b.dataset.motivo){$('#motivoIncidencia').value=b.dataset.motivo}
 else if(b.dataset.accion)accion(b.dataset.accion,b).catch(error=>alert('No se pudo completar la acción. '+error.message));
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='buscar'){ui.busca=t.value;$('#listaObras').innerHTML=listadoObras()}
 if(t.id==='textoClaude')ui.texto=t.value;
 if(t.dataset.cabecera){
  ui.borrador.cab[t.dataset.cabecera]=t.value;
  t.classList.toggle('incierta',t.value.includes('??'));
  $('#validacion').innerHTML=mensajeValidacion();
 }
 if(t.dataset.campo){
  const r=ui.borrador.filas[Number(t.dataset.fila)];
  r[t.dataset.campo]=t.value;
  if(t.dataset.campo==='cant')r.revisar=!entero(Number(t.value),1);
  t.classList.toggle('incierta',t.value.includes('??')||t.dataset.campo==='cant'&&r.revisar);
  t.closest('tr').classList.toggle('incierta',r.revisar);
  $('#validacion').innerHTML=mensajeValidacion();
 }
 if(['tipoIncidencia','cantidadIncidencia'].includes(t.id))avisoReclasificacion();
 if(t.id==='nota'||t.id==='descripcion'){
  const e=actual(),campo=t.id==='nota'?'nota':'desc';
  if(e[campo]!==t.value)cambiar(()=>{
   e[campo]=t.value;
   const texto=e.ref+': '+(campo==='nota'?'nota actualizada.':'descripción actualizada.'),ultimo=db.historial.at(-1);
   if(ultimo?.texto===texto&&ultimo.elementoId===e.id)ultimo.fechaHora=new Date().toISOString();
   else historial(e.ofiId,e.ref,texto,e.id);
  },'',false,false,false);
 }
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='archivadas'){ui.archivadas=t.checked;render()}
 if(t.id==='ofiResumen'){ui.resumenId=t.value;$('#textoResumen').value=resumen(t.value)}
 if(t.id==='diaHistorial'){
  const d=fechaISO(t.value);
  if(!d){alert('Usa una fecha válida con formato dd-mm-aaaa.');t.value=fecha(ui.dia)}
  else{ui.dia=d;render()}
 }
});
$('#archivoRespaldo').onchange=e=>{
 const f=e.target.files[0];e.target.value='';
 importar(f).catch(error=>alert(error.message));
};
$('#deshacer').onclick=()=>{
 const fn=undo;undo=null;clearTimeout(temporizador);$('#mensaje').hidden=true;if(fn)fn();
};
window.addEventListener('storage',e=>{
 if(e.key!==CLAVE&&e.key!==null)return;
 cerrarDialogo(true);undo=null;$('#mensaje').hidden=true;bloqueado=false;
 cargar();render();aviso('Registro actualizado desde otra pestaña.');
});
window.addEventListener('beforeinstallprompt',e=>{
 e.preventDefault();eventoInstalar=e;if(ui.pagina==='mas')render();
});
function conexion(){
 $('#conexion').textContent=navigator.onLine?'Registro de producción':'Sin conexión · guardado en este dispositivo';
}
window.addEventListener('online',conexion);
window.addEventListener('offline',conexion);

let listoOffline=false;
async function prepararSW(){
 if(!('serviceWorker' in navigator)||location.protocol==='file:')return;
 try{
  registroSW=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});
  const revisar=()=>{$('#actualizacion').hidden=!(registroSW.waiting&&navigator.serviceWorker.controller)};
  revisar();
  registroSW.addEventListener('updatefound',()=>{
   const w=registroSW.installing;
   w?.addEventListener('statechange',()=>{
    if(w.state==='installed'){
     revisar();
     if(!navigator.serviceWorker.controller)aviso('Aplicación preparada para usar sin conexión.');
    }
   });
  });
  navigator.serviceWorker.ready.then(()=>{
   listoOffline=true;
   if($('#estadoOffline'))$('#estadoOffline').textContent='Preparada para usar sin conexión.';
  });
  let recargando=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
   if(recargando)return;
   if(actualizando){recargando=true;location.reload()}
  });
  window.addEventListener('focus',()=>registroSW.update().catch(()=>{}));
 }catch{
  aviso('No se pudo preparar el modo sin conexión. Abre la aplicación publicada con internet e inténtalo otra vez.');
 }
}
let actualizando=false;
$('#actualizacion').onclick=async()=>{
 if($('#dialogo').open){aviso('Termina o cancela el formulario antes de actualizar.');return}
 if(ui.texto||ui.borrador){
  if(!await confirmar('Actualizar aplicación','Hay una carátula sin guardar. La actualización descartará esa vista previa. ¿Actualizar ahora?'))return;
 }
 if(registroSW?.waiting){
  actualizando=true;registroSW.waiting.postMessage({type:'SKIP_WAITING'});
 }else location.reload();
};
cargar();render();conexion();
if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});
prepararSW();
</script>
