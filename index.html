<style>
:root{--cream:#FAF5EC;--ink:#3A2E25;--teal:#1E7A78;--grey:#A89F94;--amber:#F2B233;--coral:#E8684A;--green:#3E9E5B;--line:#DED7CD}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:20px/1.5 system-ui,sans-serif}button,input,textarea,select{font:inherit}button,a,input,textarea,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:4px solid var(--amber);outline-offset:4px}h1,h2,h3,p{margin:0 0 16px}h1,h2{font-size:28px;line-height:1.25}h3{font-size:23px}small,.small{font-size:17px}.muted{color:#74685D}.brand{letter-spacing:.16em;font-size:14px;font-weight:800;color:var(--teal);margin-bottom:24px}.shell{max-width:1000px;margin:auto;padding:32px 24px 70px}header{margin-bottom:28px}.greeting{font-size:clamp(30px,5vw,40px)}.card{background:white;border:1px solid #EEE7DD;border-radius:20px;padding:24px;box-shadow:0 5px 18px #3a2e2507;margin-bottom:18px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:64px;padding:14px 24px;border:2px solid transparent;border-radius:16px;background:var(--teal);color:white;font-weight:700;text-decoration:none;line-height:1.3}.secondary{background:#fff;color:var(--teal);border-color:var(--line)}.danger{background:#A93824;color:#fff}.wide{width:100%}.actions{display:flex;gap:14px;flex-wrap:wrap;margin:22px 0}.actions>*{flex:1}.back{margin-bottom:28px}.quiet{display:inline-block;border:0;background:transparent;color:#665B51;text-decoration:underline;padding:18px 8px;min-height:60px;font-size:18px}.settings{margin-top:58px}.empty{text-align:center;padding:38px 20px;color:#74685D}.empty-icon{display:block;font-size:44px;margin-bottom:14px}label{display:block;font-weight:650;margin:16px 0 8px}input,textarea,select{width:100%;background:white;border:2px solid var(--line);border-radius:14px;padding:16px;color:var(--ink);min-height:62px}textarea{resize:vertical;min-height:180px}.search{position:relative;margin:26px 0}.search span{position:absolute;left:18px;top:18px}.search input{padding-left:56px}.search-status{margin:16px 4px}.row{display:flex;align-items:center;gap:18px;justify-content:space-between}.grow{flex:1;min-width:0}.ref{font-size:26px;font-weight:800}.hero-ref{font-size:44px}.qty{font-size:22px;color:#74685D;font-weight:500}.tap{display:block;width:100%;text-align:left;color:inherit}.element{border:1px solid #E7DFD4}.element .muted{margin-top:4px}.element .summary{margin-top:10px;font-size:18px}.status{display:inline-flex;align-items:center;gap:8px;font-size:17px;font-weight:750;border-radius:12px;padding:7px 11px;white-space:nowrap}.status:before{content:"";width:11px;height:11px;flex-shrink:0;border-radius:50%;background:var(--state)}.s0{--state:var(--grey);background:#F0ECE6}.s1{--state:var(--amber);background:#FFF1CD}.s2{--state:var(--coral);background:#FFE4DC}.s3{--state:var(--green);background:#E1F2E5}.count{text-align:right;font-size:17px;margin-top:6px}.ofi-link{display:block;width:100%;background:none;border:0;color:inherit;text-align:left;padding:20px 0;min-height:90px}.ofi-link+.ofi-link{border-top:1px solid var(--line)}progress{display:block;width:100%;height:12px;margin-top:14px;border:0;border-radius:99px;overflow:hidden;background:#EEE9E1;accent-color:var(--teal)}progress::-webkit-progress-bar{background:#EEE9E1;border-radius:99px}progress::-webkit-progress-value{background:var(--teal);border-radius:99px}progress::-moz-progress-bar{background:var(--teal);border-radius:99px}.tabs{display:flex;gap:12px;margin:28px 0}.tabs button{flex:1}.tabs .active{background:var(--teal);color:white;border-color:var(--teal)}.pieces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:16px 0 28px}.piece{min-height:120px;border:2px solid var(--line);border-radius:20px;background:white;color:var(--ink);padding:20px 14px;transition:background-color .2s,border-color .2s,transform .2s;text-align:center;overflow-wrap:anywhere}.piece:active{transform:scale(.97)}.piece b{display:block;font-size:22px}.piece .mark{font-size:30px;display:block;line-height:1.2;margin-bottom:7px}.piece small{display:block;margin-top:6px}.piece.lista{background:#E1F2E5;border-color:var(--green)}.piece.detenida{background:#FFE4DC;border-color:var(--coral)}.selecting .piece{outline:3px dashed var(--coral);outline-offset:2px}.notice{padding:20px;border-radius:16px;background:#FFF0C4;margin:20px 0}.notice p:last-child{margin:0}.success{background:#E1F2E5;color:#24683A}.error{background:#FFE4DC;color:#942F20}.note{border-left:6px solid var(--amber);background:#FFF2CD}.step{display:flex;align-items:center;gap:14px;margin-bottom:18px}.step span{display:grid;place-items:center;background:#E4F0EB;color:var(--teal);width:44px;height:44px;flex-shrink:0;border-radius:50%;font-weight:800}.step h2{margin:0;font-size:24px}.preview-line{padding:16px 0;border-bottom:1px solid var(--line)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.counter{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0}.counter-controls{display:flex;align-items:center;gap:12px}.counter button{min-width:60px;padding:10px}.counter output{min-width:35px;text-align:center;font-weight:750}.divider{border:0;border-top:1px solid var(--line);margin:26px 0}dialog{width:min(620px,calc(100% - 28px));border:0;border-radius:24px;padding:28px;background:var(--cream);color:var(--ink);max-height:90dvh;overflow:auto;box-shadow:0 20px 80px #0003}dialog::backdrop{background:#30251dcc}dialog .actions{margin-bottom:0}.toast{position:fixed;z-index:20;bottom:24px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:#fff;padding:16px 24px;border-radius:18px;box-shadow:0 6px 25px #0002;text-align:center;pointer-events:none}.update{display:block;width:100%;border:0;border-radius:0;background:#FFF0C4;color:var(--ink);padding:18px;font:700 18px/1.4 system-ui;min-height:60px}.hidden,[hidden]{display:none!important}.wrap{overflow-wrap:anywhere}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:650px){.shell{padding:24px 16px 50px}.card{padding:20px}.pieces{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.row{align-items:flex-start;flex-wrap:wrap;gap:12px}.count{text-align:left}.element .grow{flex-basis:100%}.actions{flex-direction:column}.fields{grid-template-columns:1fr}.btn{padding:14px 18px}.counter{gap:6px}.counter-controls{gap:8px}dialog{padding:22px}.search input{font-size:18px}.status{white-space:normal}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<body>
<button id="update" class="update" hidden>Hay una mejora disponible — tocar para actualizar</button>
<main id="app" class="shell"></main>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<noscript>Para abrir Mecanizado Tecma, activa JavaScript en Chrome.</noscript>
<script>
'use strict';
const VERSION='v2', KEY='mecanizado_tecma_v2';
const CONVERSION="Transcribe la carátula de la foto adjunta (Orden de Fabricación de Tecma) y calcula las piezas de cada elemento. Responde SOLO con un bloque de código, sin texto antes ni después, con este formato:\nOBRA;<nombre de la obra>\nREFERENCIA;<texto de la fila REFERENCIA, vacío si no hay>\nOFI;<solo el número de OFI>\nOP;<número de OP>\nFECHA;<dd-mm-aaaa>\nCOLOR;<COLOR ALUMINIO>\nTOTAL;<número del recuadro amarillo>\nLuego una línea por cada fila con referencia, en el mismo orden:\n<REFERENCIA>;<CANT>;<DESCRIPCION>;<MARCOS>;<HOJAS>;<PAÑOS FIJOS>\nMARCOS, HOJAS y PAÑOS FIJOS son POR UNIDAD (no multipliques por CANT). Reglas:\n1. Cada ventana o puerta que tiene hojas = 1 marco + sus hojas.\n2. Cuando hay números tipo \"2-1\", \"2-2\", \"6-4\", \"4-4\" o \"2/2\" después del sistema (GY, GTI, G6, SLIM SLIDE, etc.), el PRIMER número es la cantidad de hojas: GY 2-1 = 1 marco + 2 hojas; GTI 6-4 = 1 marco + 6 hojas.\n3. FYA PROYECCION, FYA OB, FYA ABATIR, PTA VENT ABATIR, PUERTA, TITANE PUERTA = 1 marco + 1 hoja (si dice \"N HOJAS\", son N hojas).\n4. Si dice un número delante, se repite: \"FYA 2 PROYECCION\" = 2 marcos + 2 hojas.\n5. FIJO, FIJOS, FIJO INF, FIJO LAT, PAÑO FIJO = paño fijo (1 por cada uno; \"FYA 3 FIJOS\" = 3 paños fijos, sin marcos ni hojas aparte).\n6. Si hay \"+\", suma cada parte: \"FYA 2 PROYECCION + FIJO INF\" = 2;2;1. \"PUERTA EXTERIOR + FIJO\" = 1;1;1.\n7. Un paréntesis como \"(4 MOVIL + 2 FIJOS)\" dentro de un corredero describe sus hojas (móviles y fijas), no paños fijos aparte.\n8. No suman piezas: MONTANTE, ANTEPECHO, REFORZADO, BIG, JUMBO, HM=, RIEL OCULTO, RIELES, EXTENSION RIEL, CRISTAL, TEMPLADO, FOSCO, NEW PROFILE, SILICONA, BISAGRAS, medidas.\n9. Si no estás seguro de las piezas, pon tu mejor estimación y agrega ;REVISAR al final de esa línea.\n10. Copia los textos tal como aparecen, en mayúsculas; no uses punto y coma dentro de descripciones (usa coma); no inventes filas; si algo es ilegible escribe ??.\nEjemplo de líneas correctas:\nV10;1;FYA OB 1 HOJA CRISTAL FOSCO HM=825;1;1;0\nV12A;1;GY 2-1 MONTANTE BIG HM= 1000;1;2;0\nV14.1;1;FYA FIJO;0;0;1\nV16;1;PUERTA EXTERIOR + FIJO;1;1;1\nV16;1;GTI 6-4 (4 MOVIL + 2 FIJOS) RIEL OCULTO;1;6;0";
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v??'').trim().replace(/\s+/g,' ').toUpperCase();
const normOfi=v=>norm(v).replace(/OFI/g,'').replace(/\s/g,'').replace(/^0+(?=\d)/,'');
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const day=v=>/^\d{4}-\d{2}-\d{2}/.test(v||'')?v.slice(0,10).split('-').reverse().join('-'):String(v||'');
const fresh=()=>({version:2,ofis:[],elementos:[]});
const types=['M','H','PF'], names={M:['marco','marcos'],H:['hoja','hojas'],PF:['paño fijo','paños fijos']};
const states=['Sin empezar','En proceso','Con pendiente','Listo'];
let data=fresh(),blocked=false,page={name:'home'},tab='missing',query='',preview=null,stopMode=false,correction=null,backupFile=null;
let loadError='';
function validInt(n,min=0,max=1000){return Number.isInteger(n)&&n>=min&&n<=max;}
function validate(d){
  const bad=()=>{throw Error('Esta copia no tiene el formato de Mecanizado Tecma v2.');};
  if(!d||d.version!==2||!Array.isArray(d.ofis)||!Array.isArray(d.elementos))bad();
  const ids=new Set(),ofis=new Set(),pairs=new Set();
  const id=v=>{if(typeof v!=='string'||!v||ids.has(v))bad();ids.add(v);};
  const str=v=>{if(typeof v!=='string')bad();};
  const date=v=>{if(v!=null&&typeof v!=='string')bad();};
  d.ofis.forEach(o=>{id(o.id);ofis.add(o.id);['obra','referencia','ofi','op','fecha','color','creada'].forEach(k=>str(o[k]));if(!norm(o.obra)||!normOfi(o.ofi))bad();o.obra=norm(o.obra);o.ofi=normOfi(o.ofi);const pair=JSON.stringify([o.obra,o.ofi]);if(pairs.has(pair))bad();pairs.add(pair);if(o.totalCaratula!==null&&!validInt(o.totalCaratula,0,1000000))bad();});
  d.elementos.forEach(e=>{id(e.id);if(!ofis.has(e.ofiId)||!validInt(e.cant,1)||typeof e.revisar!=='boolean'||!Array.isArray(e.piezas)||!Array.isArray(e.faltas))bad();str(e.ref);str(e.desc);if(!norm(e.ref)||e.piezas.length>20000)bad();const slots=new Set();e.piezas.forEach(p=>{id(p.id);if(!types.includes(p.tipo)||!validInt(p.unidad,1,e.cant)||!validInt(p.numero,1)||!['pendiente','lista','detenida'].includes(p.estado))bad();const slot=[p.unidad,p.tipo,p.numero].join(':');if(slots.has(slot))bad();slots.add(slot);date(p.motivo);date(p.fechaDetenida);date(p.fechaLista);});e.faltas.forEach(f=>{id(f.id);str(f.texto);str(f.fecha);if(typeof f.resuelta!=='boolean')bad();date(f.fechaResuelta);});});
  return d;
}
try{const saved=localStorage.getItem(KEY);if(saved)data=validate(JSON.parse(saved));}catch(e){blocked=true;loadError='No pude leer el avance guardado. No lo borraré. Puedes recuperar una copia desde Ajustes.';}
function save(change,replace=false){
  try{if(blocked&&!replace)throw Error('Primero recupera una copia desde Ajustes. El avance anterior sigue guardado.');const next=replace?change:JSON.parse(JSON.stringify(data));if(!replace)change(next);localStorage.setItem(KEY,JSON.stringify(next));data=next;blocked=false;return true;}catch(e){message('No se pudo guardar',e.name==='QuotaExceededError'?'Se llenó el espacio. Guarda una copia de seguridad y libera espacio antes de seguir.':e.message);return false;}
}
const element=()=>data.elementos.find(e=>e.id===page.id);
const openNotes=e=>e.faltas.filter(f=>!f.resuelta);
function status(e){const ps=e.piezas,notes=openNotes(e).length;if(!ps.length)return notes?2:0;if(ps.every(p=>p.estado==='pendiente')&&!notes)return 0;if(ps.every(p=>p.estado==='lista')&&!notes)return 3;if(!ps.some(p=>p.estado==='pendiente')&&(notes||ps.some(p=>p.estado==='detenida')))return 2;return 1;}
const ready=e=>e.piezas.filter(p=>p.estado==='lista').length;
const badge=e=>`<span class="status s${status(e)}">${states[status(e)]}</span>`;
function summary(counts){return types.filter(t=>counts[t]).map(t=>`${counts[t]} ${names[t][counts[t]===1?0:1]}`).join(' · ')||'Sin piezas · revisar';}
function counts(e,u){const c={M:0,H:0,PF:0};e.piezas.filter(p=>u==null||p.unidad===u).forEach(p=>c[p.tipo]++);return c;}
function pieceLabel(e,p){const n=e.piezas.filter(x=>x.unidad===p.unidad&&x.tipo===p.tipo).length;const s=names[p.tipo][0];return s[0].toUpperCase()+s.slice(1)+(n>1?' '+p.numero:'');}
function btn(label,action,cls='secondary',attrs=''){return `<button class="btn ${cls}" data-action="${action}" ${attrs}>${label}</button>`;}
const back=()=>btn('← Volver','back','secondary back');
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,2800);}
function modal(title,body){const d=$('#dialog');if(d.open)d.close();d.innerHTML=`<h2 id="dialog-title">${esc(title)}</h2>${body}`;d.showModal();}
function close(){if($('#dialog').open)$('#dialog').close();}
function message(title,text){modal(title,`<p>${esc(text)}</p>${btn('Entendido','close','wide')}`);}
function go(name,id){close();stopMode=false;page={name,id};history.pushState(page,'');render();window.scrollTo(0,0);}
history.replaceState(page,'');
addEventListener('popstate',e=>{close();page=e.state?.name?e.state:{name:'home'};stopMode=false;render();});
function elementCard(e,search=false){const o=data.ofis.find(o=>o.id===e.ofiId);return `<button class="card tap element" data-action="element" data-id="${esc(e.id)}"><div class="row"><div class="grow"><div class="ref">${esc(e.ref)} ${e.cant>1?`<span class="qty">×${e.cant}</span>`:''}</div><div class="muted wrap">${esc(search?o.obra+' · OFI '+o.ofi:e.desc)}</div>${search?'':`<div class="summary">${esc(summary(counts(e)))}</div>`}</div><div>${badge(e)}<div class="count">${ready(e)} de ${e.piezas.length} listas</div></div></div></button>`;}
function ofiProgress(id){const es=data.elementos.filter(e=>e.ofiId===id);let done=0,total=0;es.forEach(e=>{total+=e.cant;if(openNotes(e).length)return;for(let u=1;u<=e.cant;u++){const ps=e.piezas.filter(p=>p.unidad===u);if(ps.length&&ps.every(p=>p.estado==='lista'))done++;}});return {done,total};}
function renderHome(){const d=new Date().toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'});return `<div class="brand">TECMA / MECANIZADO</div><header><h1 class="greeting">Hola, Jorge 👋</h1><p class="muted">${esc(d[0].toUpperCase()+d.slice(1))}</p></header><label class="sr-only" for="search">Buscar obra o elemento</label><div class="search"><span aria-hidden="true">🔎</span><input id="search" type="search" placeholder="Buscar obra o elemento (ej. V16)" value="${esc(query)}" autocomplete="off"></div><div id="results"></div>${btn('➕ Cargar carátula','load','wide')}<section style="margin-top:32px">${data.ofis.length?Array.from(new Set(data.ofis.map(o=>o.obra))).map(obra=>`<div class="card"><h2 class="wrap">${esc(obra)}</h2>${data.ofis.filter(o=>o.obra===obra).map(o=>{const p=ofiProgress(o.id);return `<button class="ofi-link" data-action="ofi" data-id="${esc(o.id)}"><div class="row"><strong>OFI ${esc(o.ofi)}</strong><span>${p.done} de ${p.total} listos</span></div><progress aria-label="Avance OFI ${esc(o.ofi)}" value="${p.done}" max="${p.total||1}"></progress></button>`;}).join('')}</div>`).join(''):'<div class="empty"><span class="empty-icon">☀️</span><p>Aquí aparecerán tus obras.<br>Comienza cargando una carátula.</p></div>'}</section><div class="settings">${btn('⚙️ Ajustes','settings','quiet')}</div>`;}
function searchResults(){const root=$('#results');if(!root)return;const q=norm(query);if(!q){root.innerHTML='';return;}const matches=data.elementos.filter(e=>{const o=data.ofis.find(o=>o.id===e.ofiId);return norm(e.ref+' '+o.obra+' OFI '+o.ofi).includes(q);});root.innerHTML=`<p class="search-status muted" role="status">${matches.length?matches.length+' resultados':'No encontré ese elemento u obra.'}</p>${matches.map(e=>elementCard(e,true)).join('')}`;}
function renderOfi(){const o=data.ofis.find(o=>o.id===page.id);if(!o)return back()+'<p>Esta OFI ya no está cargada.</p>';const es=data.elementos.filter(e=>e.ofiId===o.id),shown=es.filter(e=>tab==='all'||status(e)!==3);return `${back()}<header><h1 class="wrap">${esc(o.obra)}</h1><p>OFI ${esc(o.ofi)}${o.op?' · OP '+esc(o.op):''}</p></header><div class="tabs" role="group" aria-label="Mostrar elementos">${btn('Me falta','tab','secondary '+(tab==='missing'?'active':''),`data-value="missing" aria-pressed="${tab==='missing'}"`)}${btn('Todos','tab','secondary '+(tab==='all'?'active':''),`data-value="all" aria-pressed="${tab==='all'}"`)}</div>${shown.map(e=>elementCard(e)).join('')||'<div class="card empty">¡Todo listo por aquí! 🎉</div>'}`;}
function renderElement(){const e=element();if(!e)return back()+'<p>Este elemento ya no está cargado.</p>';const o=data.ofis.find(o=>o.id===e.ofiId);return `${back()}<header><p class="muted small wrap">${esc(o.obra)} · OFI ${esc(o.ofi)}</p><h1 class="hero-ref wrap">${esc(e.ref)} ${e.cant>1?`<span class="qty">×${e.cant}</span>`:''}</h1><p class="wrap">${esc(e.desc)}</p>${badge(e)} <span class="small">${ready(e)} de ${e.piezas.length} listas</span></header>${e.revisar?'<div class="notice">Las piezas de este elemento podrían no estar bien. Si hay algo raro, toca Corregir piezas.</div>':''}${stopMode?`<div class="notice">Toca la pieza que quieres detener. ${btn('Cancelar','cancel-stop','quiet')}</div>`:''}<section class="${stopMode?'selecting':''}">${Array.from({length:e.cant},(_,i)=>i+1).map(u=>`${e.cant>1?`<h2>Unidad ${u}</h2>`:''}<div class="pieces">${e.piezas.filter(p=>p.unidad===u).map(p=>`<button class="piece ${p.estado}" data-action="piece" data-id="${esc(p.id)}" aria-label="${esc(pieceLabel(e,p))}, ${p.estado}, unidad ${u}"><span class="mark" aria-hidden="true">${p.estado==='lista'?'✓':p.estado==='detenida'?'⏸':'○'}</span><b>${esc(pieceLabel(e,p))}</b><small>${p.estado==='lista'?'Lista':p.estado==='detenida'?'Detenida':'Pendiente'}</small>${p.estado==='detenida'?`<small>${esc(p.motivo||'Sin motivo')}</small><small>${esc(day(p.fechaDetenida))}</small>`:''}</button>`).join('')||'<p class="muted">Sin piezas. Toca Corregir piezas.</p>'}</div>`).join('')}</section><div class="actions">${btn('✓ Todo listo','all-ready','',e.piezas.some(p=>p.estado==='pendiente')?'':'disabled')}${btn('⏸ Detener una pieza','stop','secondary',e.piezas.length?'':'disabled')}</div><div class="actions">${btn('📝 Anotar algo que falta','note','secondary')}</div>${openNotes(e).map(f=>`<div class="card note"><p class="wrap">${esc(f.texto)}</p><p class="muted small">${esc(day(f.fecha))}</p>${btn('Ya se resolvió','resolve','secondary',`data-id="${esc(f.id)}"`)}</div>`).join('')}${btn('Corregir piezas','correct','quiet')}`;}
function renderLoad(){return `${back()}<h1>Cargar carátula</h1><div class="card"><div class="step"><span>1</span><h2>Convierte la foto</h2></div>${btn('📋 Copiar y abrir Claude','claude','wide')}<p class="muted" style="margin-top:20px">En Claude: mantén presionado y pega, adjunta la foto de la carátula y envía. Cuando responda, toca Copiar.</p><div id="copy-fallback"></div></div><div class="card"><div class="step"><span>2</span><h2>Pega la respuesta</h2></div>${btn('📥 Pegar respuesta','paste','secondary wide')}<label for="paste-text">También puedes pegarla aquí</label><textarea id="paste-text" placeholder="Mantén presionado aquí y toca Pegar."></textarea><div class="actions">${btn('Ver carátula','parse','secondary')}</div></div><div class="card"><div class="step"><span>3</span><h2>Revisa y guarda</h2></div><div id="preview"><p class="muted">Aquí verás los elementos antes de guardarlos.</p></div></div>`;}
function previewHTML(){if(!preview)return '';const p=preview,sum=p.rows.reduce((s,e)=>s+e.cant,0),ok=p.totalCaratula===sum;return `<h2 class="wrap">${esc(p.obra)}</h2><p>OFI ${esc(p.ofi)}${p.op?' · OP '+esc(p.op):''}</p><p class="muted wrap">Referencia: ${esc(p.referencia||'—')}</p>${p.rows.map(e=>`<div class="preview-line wrap"><strong>${e.revisar?'⚠ ':''}${esc(e.ref)}${e.cant>1?' ×'+e.cant:''}</strong> · ${esc(summary(e))}${e.cant>1?' por unidad':''}</div>`).join('')}<div class="notice ${ok?'success':'error'}">${ok?`✓ Están los ${sum} elementos de la carátula`:p.totalCaratula===null?'⚠ No se pudo leer el total de la carátula. Revisa los elementos antes de guardar.':`⚠ ${sum<p.totalCaratula?'Faltan elementos':'La cantidad no coincide'}: la carátula dice ${p.totalCaratula} y se leyeron ${sum}. Toma otra foto más clara.`}</div>${btn(ok?'Guardar':'Guardar igual','save-import','wide')}`;}
function parse(text){const p={obra:'',referencia:'',ofi:'',op:'',fecha:'',color:'',totalCaratula:null,rows:[]};const headers={OBRA:'obra',REFERENCIA:'referencia',OFI:'ofi',OP:'op',FECHA:'fecha',COLOR:'color',TOTAL:'totalCaratula'};text.split(/\r?\n/).forEach((line,i)=>{line=line.trim();if(!line||line.startsWith('```'))return;const f=line.split(';').map(x=>x.trim()),key=norm(f[0]);if(f.length===2&&headers[key]){p[headers[key]]=key==='TOTAL'?(/^\d+$/.test(f[1])&&validInt(Number(f[1]),0,1000000)?Number(f[1]):null):f[1];return;}if(['REF','REFERENCIA'].includes(key)&&norm(f[1])==='CANT')return;if(f.length<6||f.length>7||!f[0])throw Error(`No pude leer la línea ${i+1}. Pega la respuesta completa de Claude.`);const ns=[f[1],f[3],f[4],f[5]],values=ns.map(Number),good=ns.every(x=>/^\d+$/.test(x))&&values.every((n,j)=>validInt(n,j===0?1:0));const [cant,M,H,PF]=good?values:[1,1,1,0];if(cant*(M+H+PF)>20000)throw Error('Esta carátula tiene demasiadas piezas en una fila. Revisa las cantidades.');p.rows.push({ref:norm(f[0]),cant,desc:f[2],M,H,PF,revisar:!good||norm(f[6])==='REVISAR'||M+H+PF===0});});p.obra=norm(p.obra);p.ofi=normOfi(p.ofi);if(!p.obra||!p.ofi||!p.rows.length)throw Error('Falta la obra, el número de OFI o los elementos. Pega la respuesta completa.');if(p.rows.reduce((s,r)=>s+r.cant*(r.M+r.H+r.PF),0)>50000)throw Error('Hay demasiadas piezas. Revisa las cantidades antes de guardar.');return p;}
function makePieces(cant,c){const ps=[];for(let u=1;u<=cant;u++)for(const t of types)for(let n=1;n<=c[t];n++)ps.push({id:uid(),tipo:t,unidad:u,numero:n,estado:'pendiente',motivo:'',fechaDetenida:null,fechaLista:null});return ps;}
function importOfi(){if(!preview)return;const old=data.ofis.find(o=>o.obra===preview.obra&&o.ofi===preview.ofi);if(old){modal('Esta OFI ya está cargada. ¿Agregar solo los elementos nuevos?',`<p>El avance que ya tienes se conserva.</p><div class="actions">${btn('Sí','confirm-import','')}${btn('No','close')}</div>`);return;}finishImport();}
function finishImport(){const p=preview;if(!p)return;let oid,added=0;const ok=save(d=>{let o=d.ofis.find(o=>o.obra===p.obra&&o.ofi===p.ofi);const exists=!!o;if(!o){o={id:uid(),obra:p.obra,referencia:p.referencia,ofi:p.ofi,op:p.op,fecha:p.fecha,color:p.color,totalCaratula:p.totalCaratula,creada:new Date().toISOString()};d.ofis.push(o);}oid=o.id;const refs=new Set(d.elementos.filter(e=>e.ofiId===oid).map(e=>norm(e.ref)));p.rows.forEach(r=>{if(exists&&refs.has(norm(r.ref)))return;d.elementos.push({id:uid(),ofiId:oid,ref:r.ref,cant:r.cant,desc:r.desc,revisar:r.revisar,piezas:makePieces(r.cant,r),faltas:[]});refs.add(norm(r.ref));added++;});});if(ok){preview=null;tab='missing';go('ofi',oid);toast(added?'Carátula guardada ✓':'No había elementos nuevos. Tu avance sigue igual.');}}
function updateElement(fn){const e=element();if(!e)return;const before=status(e),id=e.id;if(save(d=>fn(d.elementos.find(x=>x.id===id)))){close();render();const now=element();if(before!==3&&status(now)===3)toast('¡'+now.ref+' listo! 🎉');}}
function setPiece(p,state,reason=''){p.estado=state;p.motivo=state==='detenida'?reason:'';p.fechaDetenida=state==='detenida'?today():null;p.fechaLista=state==='lista'?today():null;}
function clickPiece(id){const e=element(),p=e?.piezas.find(p=>p.id===id);if(!p)return;if(stopMode){modal('¿Por qué quedó detenida?',`<p class="muted">${esc(pieceLabel(e,p))}. El motivo es opcional.</p><div class="actions" style="flex-direction:column">${['Perfil rayado','A pintura','Falta material','Error de mecanizado','Sin motivo'].map(r=>btn(esc(r),'reason','secondary',`data-id="${esc(id)}" data-reason="${esc(r==='Sin motivo'?'':r)}"`)).join('')}${btn('Cancelar','close','quiet')}</div>`);}else if(p.estado==='detenida'){modal('¿Ya está lista?',`<div class="actions">${btn('Sí, está lista','held-ready','',`data-id="${esc(id)}"`)}${btn('No','close')}</div>`);}else updateElement(e=>setPiece(e.piezas.find(p=>p.id===id),p.estado==='lista'?'pendiente':'lista'));}
function correctionDialog(){modal('Corregir piezas',`<p class="muted">Indica las piezas de cada unidad.</p>${correction.map((c,i)=>`<section>${correction.length>1?`<h3>Unidad ${i+1}</h3>`:''}${types.map(t=>`<div class="counter"><span>${names[t][1][0].toUpperCase()+names[t][1].slice(1)}</span><div class="counter-controls">${btn('−','adjust','secondary',`data-unit="${i}" data-type="${t}" data-delta="-1" aria-label="Quitar ${names[t][0]}, unidad ${i+1}"`)}<output id="c-${i}-${t}">${c[t]}</output>${btn('+','adjust','secondary',`data-unit="${i}" data-type="${t}" data-delta="1" aria-label="Agregar ${names[t][0]}, unidad ${i+1}"`)}</div></div>`).join('')}<hr class="divider"></section>`).join('')}<div class="actions">${btn('Guardar','save-correction','')}${btn('Cancelar','close')}</div>`);}
function saveCorrection(confirmed=false){const e=element();if(!e||!correction)return;const total=correction.reduce((s,c)=>s+c.M+c.H+c.PF,0);if(total>20000){message('Revisa las cantidades','Hay demasiadas piezas en este elemento.');return;}const removed=e.piezas.filter(p=>p.numero>correction[p.unidad-1][p.tipo]).length;if(removed&&!confirmed){modal('¿Quitar estas piezas?',`<p>Se eliminarán ${removed} piezas y su avance. Las demás se conservan.</p><div class="actions">${btn('Sí, quitar','confirm-correction','danger')}${btn('Volver a corregir','return-correction')}</div>`);return;}updateElement(e=>{const previous=new Map(e.piezas.map(p=>[[p.unidad,p.tipo,p.numero].join(':'),p]));e.piezas=[];correction.forEach((c,i)=>types.forEach(t=>{for(let n=1;n<=c[t];n++)e.piezas.push(previous.get([i+1,t,n].join(':'))||{id:uid(),tipo:t,unidad:i+1,numero:n,estado:'pendiente',motivo:'',fechaDetenida:null,fechaLista:null});}));e.revisar=correction.some(c=>c.M+c.H+c.PF===0);});}
function renderSettings(){return `${back()}<h1>Ajustes</h1><div class="card"><div class="actions" style="flex-direction:column">${btn('💾 Guardar copia de seguridad','backup','secondary')}${btn('📂 Recuperar copia de seguridad','restore','secondary')}${btn('Eliminar una OFI','delete-ofi','secondary')}${btn('Cargar OFI a mano','manual','secondary')}</div><input id="restore-file" type="file" accept=".json,application/json" hidden><p class="muted small">La copia incluye las obras y todo tu avance.</p></div><p class="muted small">Versión ${VERSION}</p>`;}
function manualRow(){return `<div class="card manual-row"><h2>Elemento</h2><div class="fields"><label>Referencia<input name="ref" placeholder="V16" required></label><label>Cantidad<input name="cant" type="number" min="1" max="1000" step="1" value="1" required></label></div><label>Descripción<input name="desc" placeholder="Ventana del living"></label><p class="muted small">Piezas por unidad</p><div class="fields">${types.map(t=>`<label>${names[t][1]}<input name="${t}" type="number" min="0" max="1000" step="1" value="${t==='PF'?0:1}" required></label>`).join('')}</div>${btn('Quitar este elemento','remove-row','quiet')}</div>`;}
function renderManual(){return `${back()}<h1>Cargar OFI a mano</h1><form id="manual-form"><div class="card"><label>Obra<input name="obra" required></label><label>OFI<input name="ofi" required></label></div><div id="manual-rows">${manualRow()}</div>${btn('➕ Agregar elemento','add-row','secondary','type="button"')}<div class="actions"><button class="btn wide" type="submit">Guardar</button></div></form>`;}
function render(){const views={home:renderHome,ofi:renderOfi,element:renderElement,load:renderLoad,settings:renderSettings,manual:renderManual};$('#app').innerHTML=(views[page.name]||renderHome)();document.querySelectorAll('#manual-form button[data-action]').forEach(b=>b.type='button');if(page.name==='home')searchResults();}
async function copyClaude(){let popup=window.open('about:blank','_blank');if(popup)popup.opener=null;try{if(!navigator.clipboard?.writeText)throw Error();await navigator.clipboard.writeText(CONVERSION);toast('Copiado ✓');const b=document.querySelector('[data-action="claude"]');if(b)b.textContent='Copiado ✓ · Abrir Claude';if(popup)popup.location.replace('https://claude.ai/new');else $('#copy-fallback').innerHTML='<p>Copiado ✓</p><a class="btn secondary wide" href="https://claude.ai/new" target="_blank" rel="noopener noreferrer">Abrir Claude</a>';}catch{if(popup)popup.close();$('#copy-fallback').innerHTML=`<label for="conversion">Copia este texto y luego abre Claude</label><textarea id="conversion" readonly>${esc(CONVERSION)}</textarea><a class="btn secondary wide" href="https://claude.ai/new" target="_blank" rel="noopener noreferrer">Abrir Claude</a>`;$('#conversion').select();}}
function parsePreview(){try{preview=parse($('#paste-text').value);$('#preview').innerHTML=previewHTML();$('#preview').scrollIntoView({behavior:'smooth',block:'start'});}catch(e){preview=null;$('#preview').innerHTML=`<div class="notice error" role="alert">${esc(e.message)}</div>`;}}
function downloadBackup(){let contents;try{contents=blocked?localStorage.getItem(KEY):JSON.stringify(data,null,2);if(!contents)throw Error();}catch{message('No pude preparar la copia','Vuelve a abrir la aplicación y prueba otra vez.');return;}const file=new File([contents],'mecanizado-respaldo-'+today()+'.json',{type:'application/json'});backupFile=file;const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=file.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);let share=false;try{share=!!navigator.canShare?.({files:[file]});}catch{}modal('Copia de seguridad',`<p>La copia se está descargando. Guárdala en un lugar seguro.</p><div class="actions">${share?btn('Compartir copia','share',''):''}${btn('Listo','close')}</div>`);}
let restoreData=null;
async function readBackup(file){if(!file)return;try{if(file.size>15000000)throw Error('Esta copia es demasiado grande.');restoreData=validate(JSON.parse(await file.text()));modal('¿Recuperar esta copia?',`<p>Se reemplazará todo el avance de esta tablet por ${restoreData.ofis.length} OFI y ${restoreData.elementos.length} elementos de la copia.</p><div class="actions">${btn('Sí, recuperar','confirm-restore','danger')}${btn('Cancelar','close')}</div>`);}catch(e){restoreData=null;message('No pude abrir la copia',e instanceof SyntaxError?'Selecciona una copia de seguridad de Mecanizado Tecma.':e.message);}}
function deleteOfiDialog(){if(!data.ofis.length){message('No hay OFI cargadas','Cuando cargues una carátula, aparecerá aquí.');return;}modal('Eliminar una OFI',`<label for="delete-select">Elige la OFI</label><select id="delete-select">${data.ofis.map(o=>`<option value="${esc(o.id)}">${esc(o.obra)} · OFI ${esc(o.ofi)}</option>`).join('')}</select><div class="actions">${btn('Continuar','ask-delete','danger')}${btn('Cancelar','close')}</div>`);}
document.addEventListener('click',async event=>{
  const b=event.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;
  switch(a){
    case 'back':history.back();break;
    case 'close':close();break;
    case 'settings':go('settings');break;
    case 'load':preview=null;go('load');break;
    case 'ofi':tab='missing';go('ofi',id);break;
    case 'element':go('element',id);break;
    case 'tab':tab=b.dataset.value;render();break;
    case 'piece':clickPiece(id);break;
    case 'all-ready':updateElement(e=>e.piezas.filter(p=>p.estado==='pendiente').forEach(p=>setPiece(p,'lista')));break;
    case 'stop':stopMode=true;render();break;
    case 'cancel-stop':stopMode=false;render();break;
    case 'reason':stopMode=false;updateElement(e=>setPiece(e.piezas.find(p=>p.id===id),'detenida',b.dataset.reason));break;
    case 'held-ready':updateElement(e=>setPiece(e.piezas.find(p=>p.id===id),'lista'));break;
    case 'note':modal('Anotar algo que falta',`<form id="note-form"><label for="note-text">¿Qué falta?</label><textarea id="note-text" placeholder="Falta perfil separador" maxlength="1000" required></textarea><div class="actions"><button class="btn" type="submit">Guardar</button>${btn('Cancelar','close','secondary','type="button"')}</div></form>`);break;
    case 'resolve':updateElement(e=>{const f=e.faltas.find(f=>f.id===id);f.resuelta=true;f.fechaResuelta=today();});break;
    case 'correct':correction=Array.from({length:element().cant},(_,i)=>counts(element(),i+1));correctionDialog();break;
    case 'adjust':{const u=Number(b.dataset.unit),t=b.dataset.type;correction[u][t]=Math.max(0,Math.min(1000,correction[u][t]+Number(b.dataset.delta)));$(`#c-${u}-${t}`).textContent=correction[u][t];break;}
    case 'save-correction':saveCorrection();break;
    case 'confirm-correction':saveCorrection(true);break;
    case 'return-correction':correctionDialog();break;
    case 'claude':await copyClaude();break;
    case 'paste':try{$('#paste-text').value=await navigator.clipboard.readText();parsePreview();}catch{$('#paste-text').focus();toast('Mantén presionado en el cuadro y toca Pegar.');}break;
    case 'parse':parsePreview();break;
    case 'save-import':importOfi();break;
    case 'confirm-import':finishImport();break;
    case 'backup':downloadBackup();break;
    case 'share':try{await navigator.share({files:[backupFile],title:'Copia de Mecanizado Tecma'});close();}catch(e){if(e.name!=='AbortError')message('Puedes compartirla después','Busca la copia en Descargas y toca Compartir.');}break;
    case 'restore':$('#restore-file').click();break;
    case 'confirm-restore':if(restoreData&&save(restoreData,true)){restoreData=null;go('home');toast('Copia recuperada ✓');}break;
    case 'delete-ofi':deleteOfiDialog();break;
    case 'ask-delete':{const o=data.ofis.find(o=>o.id===$('#delete-select').value);modal('¿Eliminar esta OFI?',`<p>${esc(o.obra)} · OFI ${esc(o.ofi)}</p><p>Se eliminarán sus elementos y todo su avance.</p><div class="actions">${btn('Sí, eliminar','confirm-delete','danger',`data-id="${esc(o.id)}"`)}${btn('Cancelar','close')}</div>`);break;}
    case 'confirm-delete':if(save(d=>{d.ofis=d.ofis.filter(o=>o.id!==id);d.elementos=d.elementos.filter(e=>e.ofiId!==id);})){close();render();toast('OFI eliminada');}break;
    case 'manual':go('manual');break;
    case 'add-row':$('#manual-rows').insertAdjacentHTML('beforeend',manualRow());document.querySelectorAll('#manual-form button[data-action]').forEach(b=>b.type='button');$('#manual-rows').lastElementChild.querySelector('input').focus();break;
    case 'remove-row':{const row=b.closest('.manual-row');modal('¿Quitar este elemento?',`<div class="actions">${btn('Sí, quitar','confirm-remove-row','danger')}${btn('Cancelar','close')}</div>`);$('#dialog [data-action="confirm-remove-row"]').onclick=()=>{row.remove();close();};break;}
  }
});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;searchResults();}if(e.target.id==='paste-text'){preview=null;$('#preview').innerHTML='<p class="muted">Toca Ver carátula para revisar esta respuesta.</p>';}});
document.addEventListener('change',e=>{if(e.target.id==='restore-file'){readBackup(e.target.files[0]);e.target.value='';}});
document.addEventListener('submit',e=>{
  if(e.target.id==='note-form'){e.preventDefault();const text=$('#note-text').value.trim();if(text)updateElement(e=>e.faltas.push({id:uid(),texto:text,fecha:today(),resuelta:false,fechaResuelta:null}));}
  if(e.target.id==='manual-form'){e.preventDefault();const f=e.target,rows=Array.from(f.querySelectorAll('.manual-row')).map(row=>Object.fromEntries(Array.from(row.querySelectorAll('input')).map(i=>[i.name,i.value])));try{if(!rows.length)throw Error('Agrega al menos un elemento.');const obra=f.elements.obra.value.trim(),ofi=f.elements.ofi.value.trim();if([obra,ofi,...rows.flatMap(r=>[r.ref,r.desc])].some(v=>/[;\r\n]/.test(v)))throw Error('Usa comas en lugar de punto y coma.');preview=parse(`OBRA;${obra}\nOFI;${ofi}\nTOTAL;${rows.reduce((s,r)=>s+Number(r.cant),0)}\n`+rows.map(r=>[r.ref,r.cant,r.desc,r.M,r.H,r.PF].join(';')).join('\n'));importOfi();}catch(err){message('Revisa la carátula',err.message);}}
});
addEventListener('storage',e=>{if(e.key!==KEY)return;try{data=e.newValue?validate(JSON.parse(e.newValue)):fresh();close();stopMode=false;render();toast('Avance actualizado');}catch{message('No pude actualizar el avance','Cierra y vuelve a abrir la aplicación.');}});
render();if(loadError)message('Tu avance necesita revisión',loadError);
try{navigator.storage?.persist?.().catch(()=>{});}catch{}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  let waiting=null,reloading=false,requested=false;
  navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).then(reg=>{
    const show=()=>{if(reg.waiting&&navigator.serviceWorker.controller){waiting=reg.waiting;$('#update').hidden=false;}};
    show();reg.addEventListener('updatefound',()=>{const worker=reg.installing;worker?.addEventListener('statechange',()=>{if(worker.state==='installed')show();});});
    $('#update').onclick=()=>{if(waiting){requested=true;waiting.postMessage({type:'SKIP_WAITING'});}};
    const check=()=>{show();reg.update().catch(()=>{});};check();addEventListener('online',check);document.addEventListener('visibilitychange',()=>{if(!document.hidden)check();});
  }).catch(()=>toast('Abre la app con internet una vez para preparar el uso sin conexión.'));
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(requested&&!reloading){reloading=true;location.reload();}});
}
</script>
</body>
